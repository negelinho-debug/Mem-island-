
name: MEM ISLAND - Build iPhone IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MEM ISLAND
        shell: bash
        run: |
          set -euo pipefail
          test -f MEM_ISLAND_3D_Memes_v2.zip
          mkdir -p "$RUNNER_TEMP/mem-island"
          unzip -q MEM_ISLAND_3D_Memes_v2.zip -d "$RUNNER_TEMP/mem-island"
          cp -R "$RUNNER_TEMP/mem-island/MEM_ISLAND_Godot/." .
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f assets/icon.png
          grep -q 'import_etc2_astc=true' project.godot

      - name: Configure iOS export
        shell: bash
        run: |
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.negelinho.memisland"
          application/export_project_only=true
          application/delete_old_export_files_unconditionally=true
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/short_version="0.2"
          application/version="2"
          orientation/portrait=false
          orientation/landscape_left=true
          orientation/landscape_right=true
          icons/icon_1024x1024="res://assets/icon.png"
          PRESET

      - name: Build unsigned MEM ISLAND IPA
        uses: gamekiller2048/Godot-Unsigned-IOS@v2
        with:
          godot-version: '4.4.1'
          godot-flavor: 'stable'
          export-name: 'MemIsland'
          configuration: 'release'
